<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval 报告</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto; max-width: 860px; color: #1a1a1a; line-height: 1.5; }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin-top: 2rem; border-bottom: 1px solid #eee; padding-bottom: .3rem; }
  table { border-collapse: collapse; margin: .6rem 0; font-size: .9rem; }
  td, th { border: 1px solid #ddd; padding: .35rem .8rem; text-align: left; }
  th { background: #f7f7f7; }
  .big { font-size: 1.15rem; font-weight: 600; }
  .pass { color: #0a7a3d; } .fail { color: #b00020; }
  .muted { color: #777; font-size: .8rem; }
  .na { color: #999; font-style: italic; }
</style>
</head>
<body>
<h1>Eval 报告</h1>
<div id="app" class="muted">加载中…（若此页无内容，报告数据缺失）</div>
<script>
const data = __DATA__;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function tbl(head, rows) {
  const ths = head.map(h => '<th>' + esc(h) + '</th>').join('');
  const trs = rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('');
  return '<table><tr>' + ths + '</tr>' + trs + '</table>';
}

const app = document.getElementById('app');
if (data.error) { app.innerHTML = '<p class="fail">' + esc(data.error) + '</p>'; }
else {
  const m = data.metrics || {};
  const ci = m.accuracy_ci ? ` (95% CI ${m.accuracy_ci[0]}–${m.accuracy_ci[1]})` : '';
  let html = `<p>n=<b>${data.n}</b> 已标注=<b>${data.labeled}</b> 未标注=${data.unlabeled}</p>`;

  html += '<h2>指标</h2>';
  html += tbl(['指标', '值'], [
    ['accuracy' + ci, `<span class="big">${(+m.accuracy).toFixed(3)}</span>`],
    ['precision', (+m.precision).toFixed(3)],
    ['recall', (+m.recall).toFixed(3)],
    ['f1', (+m.f1).toFixed(3)],
  ]);

  html += '<h2>混淆矩阵</h2>';
  const c = data.confusion || {};
  html += tbl(['', '预测 pass', '预测 fail'], [
    ['实际 pass', c.tp, c.fn],
    ['实际 fail', c.fp, c.tn],
  ]);

  if (data.qwk) {
    const q = data.qwk;
    html += '<h2>QWK（序数一致性）</h2>';
    const qci = q.ci ? ` (bootstrap CI ${q.ci[0]}–${q.ci[1]})` : '';
    html += `<p class="big">${q.value.toFixed(3)}</p><p class="muted">n=${q.n}, ${q.n_classes} 档${qci}。QWK 需与其他指标一起报（量纲敏感 / kappa paradox，见 references/metrics-taxonomy.md）。</p>`;
  } else {
    html += '<h2>QWK（序数一致性）</h2><p class="na">不适用——predicted/actual 两侧缺 band 标注。</p>';
  }

  if (data.discrimination && data.discrimination.length) {
    html += '<h2>逐组区分度</h2>';
    html += tbl(['group', 'mean_pass', 'mean_fail', 'n_pass', 'n_fail'],
      data.discrimination.map(d => [d.g, d.mean_pass, d.mean_fail, d.n_pass, d.n_fail]));
  }

  html += '<p class="muted">小样本纪律：n&lt;30 时逐条 case review 比汇总数字可信；阈值只定量级，见 references/metrics-taxonomy.md。</p>';
  app.innerHTML = html;
}
</script>
</body>
</html>
